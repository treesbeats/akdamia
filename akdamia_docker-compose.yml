version: '3.7'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: akdamia
      POSTGRES_USER: akdamia
      POSTGRES_PASSWORD: akdamia
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

volumes:
  db_data:
