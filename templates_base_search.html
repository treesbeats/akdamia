<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>akdamia — Academic Citations</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #93c5fd;
            --secondary: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --radius: 0.5rem;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            color: var(--gray-900);
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 3rem 1rem;
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .tagline {
            opacity: 0.95;
            font-size: 0.95rem;
            font-weight: 300;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .search-container {
            background: white;
            padding: 2rem 1rem;
            margin: -2rem 1rem 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 10;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
        }

        .search-input {
            flex: 1;
            padding: 0.875rem 1rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-btn {
            padding: 0.875rem 2rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .main {
            padding: 2rem 0;
        }

        .results-count {
            color: var(--gray-600);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .citation-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .citation-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .citation-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .citation-title a {
            color: var(--primary);
            text-decoration: none;
        }

        .citation-title a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .citation-authors {
            color: var(--gray-600);
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
        }

        .citation-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 0.75rem 0;
            border-top: 1px solid var(--gray-100);
            border-bottom: 1px solid var(--gray-100);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .meta-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .meta-value {
            color: var(--gray-700);
            font-size: 0.95rem;
        }

        .citation-abstract {
            color: var(--gray-600);
            margin-bottom: 1rem;
            line-height: 1.7;
        }

        .citation-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            background: linear-gradient(135deg, var(--primary-light), #dbeafe);
            color: var(--primary-dark);
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            background: white;
            color: var(--gray-700);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--gray-50);
            border-color: var(--gray-400);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }

        .empty-text {
            color: var(--gray-600);
        }

        .footer {
            background: var(--gray-900);
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
            font-size: 0.875rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .pagination button {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--gray-300);
            background: white;
            color: var(--gray-700);
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        @media (max-width: 768px) {
            .header {
                padding: 2rem 1rem;
            }

            .logo {
                font-size: 1.5rem;
            }

            .search-box {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
            }

            .citation-meta {
                flex-direction: column;
                gap: 0.5rem;
            }

            .search-container {
                margin: -1.5rem 1rem 2rem;
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <span>akdamia</span>
            </div>
            <p class="tagline">Search the world's academic citations instantly</p>
        </div>
    </header>

    <div class="container">
        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search for authors, titles, or keywords... e.g., 'First Name Last Name'"
                    autocomplete="off"
                >
                <button class="search-btn" onclick="performSearch()">Search</button>
            </div>
        </div>

        <main class="main">
            <div id="results"></div>
        </main>
    </div>

    <footer class="footer">
        <p>🚀 akdamia — Open-source Academic Citations Platform | Built with Django + Elasticsearch</p>
        <p style="margin-top: 0.5rem; opacity: 0.7;">
            <a href="/admin" style="color: inherit; text-decoration: underline;">Admin</a> • 
            <a href="https://github.com/treesbeats/akdamia" style="color: inherit; text-decoration: underline;">GitHub</a>
        </p>
    </footer>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');

        // Allow Enter key to trigger search
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        async function performSearch() {
            const query = searchInput.value.trim();
            
            if (!query) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">Start Searching</div>
                        <div class="empty-text">Enter an author name, title, or keyword to find citations</div>
                    </div>
                `;
                return;
            }

            resultsDiv.innerHTML = `
                <div class="empty-state">
                    <div class="loading"></div>
                </div>
            `;

            try {
                const response = await fetch(`/api/search/?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    let html = `<div class="results-count">Found ${data.results.length} result${data.results.length !== 1 ? 's' : ''}</div>`;
                    
                    data.results.forEach(citation => {
                        html += renderCitation(citation);
                    });

                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">😕</div>
                            <div class="empty-title">No Results Found</div>
                            <div class="empty-text">Try a different search term or browse popular citations</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Search Error</div>
                        <div class="empty-text">An error occurred while searching. Please try again.</div>
                    </div>
                `;
            }
        }

        function renderCitation(citation) {
            const authors = citation.authors ? citation.authors.split(';').join(', ') : 'Unknown';
            const year = citation.year || 'N/A';
            const journal = citation.journal || citation.source || 'Academic Citation';
            
            return `
                <div class="citation-card">
                    <div class="citation-title">${escapeHtml(citation.title)}</div>
                    <div class="citation-authors">by ${escapeHtml(authors)}</div>
                    
                    <div class="citation-meta">
                        <div class="meta-item">
                            <span class="meta-label">Year</span>
                            <span class="meta-value">${year}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Published In</span>
                            <span class="meta-value">${escapeHtml(journal)}</span>
                        </div>
                        ${citation.doi ? `
                        <div class="meta-item">
                            <span class="meta-label">DOI</span>
                            <span class="meta-value"><code>${escapeHtml(citation.doi)}</code></span>
                        </div>
                        ` : ''}
                    </div>

                    ${citation.abstract ? `<div class="citation-abstract">${escapeHtml(citation.abstract.substring(0, 300))}${citation.abstract.length > 300 ? '...' : ''}</div>` : ''}

                    <div class="actions">
                        <button class="btn btn-primary" onclick="copyCitation(${JSON.stringify(citation).replace(/"/g, '&quot;')})">
                            📋 Copy Citation
                        </button>
                        ${citation.url ? `<a href="${citation.url}" target="_blank" class="btn">🔗 View Online</a>` : ''}
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function copyCitation(citation) {
            const apa = `${citation.authors || 'Unknown'} (${citation.year || 'n.d.'}). ${citation.title}. ${citation.journal || 'Unknown Publisher'}.`;
            navigator.clipboard.writeText(apa).then(() => {
                alert('Citation copied to clipboard (APA format)');
            });
        }

        // Load initial results
        window.addEventListener('load', () => {
            resultsDiv.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📚</div>
                    <div class="empty-title">Welcome to akdamia</div>
                    <div class="empty-text">Search our database of academic citations. Try searching for "First Name Last Name" to get started.</div>
                </div>
            `;
        });
    </script>
</body>
</html>
