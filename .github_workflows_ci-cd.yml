name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, scaffold]
  pull_request:
    branches: [main, develop, scaffold]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test job
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_akdamia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9200:9200

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r akdamia_requirements.txt
          pip install pytest pytest-django pytest-cov flake8

      - name: Lint with flake8
        run: |
          flake8 akdamia search --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 akdamia search --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django checks
        env:
          DEBUG: 'False'
          SECRET_KEY: test-secret-key
          DB_NAME: test_akdamia
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          ELASTICSEARCH_HOST: localhost:9200
        run: |
          python manage.py check

      - name: Run migrations
        env:
          DEBUG: 'False'
          SECRET_KEY: test-secret-key
          DB_NAME: test_akdamia
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          ELASTICSEARCH_HOST: localhost:9200
        run: |
          python manage.py migrate

      - name: Run tests
        env:
          DEBUG: 'False'
          SECRET_KEY: test-secret-key
          DB_NAME: test_akdamia
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          ELASTICSEARCH_HOST: localhost:9200
        run: |
          pytest --cov=search --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Build and push Docker image
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging (optional)
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.akdamia.example.com

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to staging
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_STAGING }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_STAGING }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER_STAGING }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST \
            "cd /app && docker-compose pull && docker-compose up -d && \
             docker-compose exec -T web python manage.py migrate && \
             docker-compose exec -T web python manage.py search_index --rebuild"

  # Deploy to production (optional)
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://akdamia.example.com
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_PROD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_PROD }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER_PROD }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST \
            "cd /app && docker-compose pull && docker-compose up -d && \
             docker-compose exec -T web python manage.py migrate && \
             docker-compose exec -T web python manage.py search_index --rebuild && \
             docker-compose exec -T web python manage.py collectstatic --noinput"

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "Application is now live at https://akdamia.example.com"
